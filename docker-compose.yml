version: '3.8'

services:
  playwright-tests:
    build: .
    container_name: playwright-framework
    volumes:
      - ./target:/app/target
      - ./src:/app/src
    environment:
      - BROWSER=chromium
      - HEADLESS=true
      - ENV=qa
    command: mvn clean test -Dbrowser=${BROWSER} -Dheadless=${HEADLESS} -Denv=${ENV}
    
  allure-report:
    image: frankescobar/allure-docker-service
    container_name: allure-service
    ports:
      - "5050:5050"
    volumes:
      - ./target/allure-results:/app/allure-results
    environment:
      CHECK_RESULTS_EVERY_SECONDS: 5
      KEEP_HISTORY: 1
